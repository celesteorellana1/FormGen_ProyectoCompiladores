<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroEmpleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6dd5ed 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-wrapper {
            padding: 50px 15px;
        }

        .form-card {
            max-width: 1000px;
            margin: 0 auto;
            border: none;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
        }

        .form-header {
            background: linear-gradient(90deg, #4f46e5, #7c3aed, #06b6d4);
            color: white;
            padding: 28px 32px;
        }

        .form-header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-header p {
            margin: 8px 0 0 0;
            opacity: 0.95;
            font-size: 1rem;
        }

        .form-body {
            padding: 32px;
        }

        .section-block {
            margin-bottom: 32px;
            padding: 24px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            border: 1px solid #e9eef8;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.06);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c2f6f;
            margin-bottom: 22px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecff;
        }

        .section-title i {
            color: #6d28d9;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .field-icon {
            color: #6366f1;
            margin-right: 8px;
        }

        .form-control,
        .form-select,
        textarea.form-control {
            border-radius: 14px;
            border: 1px solid #d8e1f0;
            padding: 12px 14px;
            box-shadow: none;
            transition: all 0.25s ease;
            background-color: #ffffff;
        }

        .form-control:focus,
        .form-select:focus,
        textarea.form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.18);
        }

        .form-control:hover,
        .form-select:hover,
        textarea.form-control:hover {
            border-color: #b8c5e2;
        }

        .form-check {
            background: #f8faff;
            border: 1px solid #e4ebf7;
            border-radius: 14px;
            padding: 14px 16px 14px 40px;
        }

        .form-check-input {
            transform: scale(1.2);
            margin-top: 0.25rem;
        }

        .form-check-label {
            font-weight: 600;
            color: #334155;
        }

        .btn-submit {
            background: linear-gradient(90deg, #4f46e5, #7c3aed, #06b6d4);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 28px;
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.25);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.3);
            color: white;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 0.95rem;
        }

        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
        }

        .form-card {
            background: rgba(15, 23, 42, 0.95);
            color: white;
        }

        .form-body {
            background: transparent;
        }

        .section-block {
            background: linear-gradient(180deg, #111827, #1f2937);
            border-color: #334155;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .section-title,
        .form-label,
        .form-check-label,
        .footer-note {
            color: #e5e7eb;
        }

        .form-control,
        .form-select,
        textarea.form-control {
            background-color: #0f172a;
            color: white;
            border-color: #475569;
        }

        .form-control::placeholder,
        textarea.form-control::placeholder {
            color: #94a3b8;
        }

        .form-check {
            background: #0f172a;
            border-color: #334155;
        }
        
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="form-card">
            <div class="form-header">
                <h1>RegistroEmpleado</h1>
                <p>Formulario generado automáticamente por FormGen</p>
            </div>

            <div class="form-body">
                <form method="post">
                    
                        <div class="section-block">
                            <div class="section-title">
                                <i class="bi bi-layout-text-window-reverse"></i>
                                <span>DatosPersonales</span>
                            </div>

                            <div class="row">
                                
                                    
                                        <div class="col-md-6 mb-3">

                                            
                                                <label for="nombre" class="form-label">
                                                    
                                                    Nombre completo
                                                </label>
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="nombre"
                                                    name="nombre"
                                                    placeholder="Juan Pérez"
                                                    required
                                                    
                                                    minlength="3"
                                                    maxlength="80"
                                                    
                                                    
                                                >
                                            

                                        </div>
                                    
                                
                                    
                                        <div class="col-md-6 mb-3">

                                            
                                                <label for="email" class="form-label">
                                                    
                                                    Correo electrónico
                                                </label>
                                                <input
                                                    type="email"
                                                    class="form-control"
                                                    id="email"
                                                    name="email"
                                                    
                                                    required
                                                    
                                                    
                                                    
                                                    
                                                    
                                                >
                                            

                                        </div>
                                    
                                
                            </div>
                        </div>
                    

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-submit">
                            Enviar
                        </button>
                    </div>
                </form>

                <div class="footer-note">
                    Interfaz generada automáticamente desde el DSL de FormGen
                </div>
            </div>
        </div>
    </div>
</body>
</html>
