<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroCompleto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="">
    <div class="container mt-5">
        <div class="card shadow p-4 ">
            <h1 class="mb-4">RegistroCompleto</h1>

            <form method="post">
                
                    <div class="mb-4">
                        <h3>DatosPersonales</h3>

                        <div class="row">
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="nombre" class="form-label">
                                                
                                                nombre
                                            </label>
                                            <input
                                                type="text"
                                                class="form-control"
                                                id="nombre"
                                                name="nombre"
                                                
                                                required
                                                
                                                minlength="3"
                                                maxlength="80"
                                                
                                                
                                            >
                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="email" class="form-label">
                                                
                                                email
                                            </label>
                                            <input
                                                type="email"
                                                class="form-control"
                                                id="email"
                                                name="email"
                                                
                                                required
                                                
                                                
                                                
                                                
                                                
                                            >
                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="password" class="form-label">
                                                
                                                password
                                            </label>
                                            <input
                                                type="password"
                                                class="form-control"
                                                id="password"
                                                name="password"
                                                
                                                required
                                                
                                                minlength="8"
                                                
                                                
                                                
                                            >
                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="fecha_nacimiento" class="form-label">
                                                
                                                fecha_nacimiento
                                            </label>
                                            <input
                                                type="date"
                                                class="form-control"
                                                id="fecha_nacimiento"
                                                name="fecha_nacimiento"
                                                
                                                required
                                                
                                                
                                                
                                                
                                                
                                            >
                                        

                                    </div>
                                
                            
                        </div>
                    </div>
                
                    <div class="mb-4">
                        <h3>DatosLaborales</h3>

                        <div class="row">
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="puesto" class="form-label">
                                                
                                                puesto
                                            </label>
                                            <select
                                                class="form-select"
                                                id="puesto"
                                                name="puesto"
                                                required
                                                
                                            >
                                                <option value="">Seleccione una opción</option>
                                                
                                                    <option value="Desarrollador">Desarrollador</option>
                                                
                                                    <option value="Diseñador">Diseñador</option>
                                                
                                                    <option value="Analista">Analista</option>
                                                
                                                    <option value="Gerente">Gerente</option>
                                                
                                            </select>

                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="salario" class="form-label">
                                                
                                                salario
                                            </label>
                                            <input
                                                type="number"
                                                class="form-control"
                                                id="salario"
                                                name="salario"
                                                
                                                
                                                
                                                
                                                
                                                min="1000.0"
                                                max="99999.99"
                                            >
                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="edad" class="form-label">
                                                
                                                edad
                                            </label>
                                            <input
                                                type="number"
                                                class="form-control"
                                                id="edad"
                                                name="edad"
                                                
                                                
                                                
                                                
                                                
                                                min="18.0"
                                                max="65.0"
                                            >
                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="descripcion" class="form-label">
                                                
                                                descripcion
                                            </label>
                                            <textarea
                                                class="form-control"
                                                id="descripcion"
                                                name="descripcion"
                                                
                                                
                                                
                                                
                                                maxlength="500"
                                            ></textarea>

                                        

                                    </div>
                                
                            
                        </div>
                    </div>
                
                    <div class="mb-4">
                        <h3>Configuracion</h3>

                        <div class="row">
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <div class="form-check">
                                                <input
                                                    class="form-check-input"
                                                    type="checkbox"
                                                    id="activo"
                                                    name="activo"
                                                    
                                                    
                                                >
                                                <label class="form-check-label" for="activo">
                                                    
                                                    activo
                                                </label>
                                            </div>

                                        

                                    </div>
                                
                            
                                
                                    <div class="col-md-6 mb-3">

                                        
                                            <label for="readonly_field" class="form-label">
                                                
                                                readonly_field
                                            </label>
                                            <input
                                                type="text"
                                                class="form-control"
                                                id="readonly_field"
                                                name="readonly_field"
                                                
                                                
                                                
                                                
                                                
                                                
                                                
                                            >
                                        

                                    </div>
                                
                            
                                
                            
                        </div>
                    </div>
                

                <button type="submit" class="btn btn-primary">
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
