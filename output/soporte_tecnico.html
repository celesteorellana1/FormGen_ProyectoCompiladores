  >    <div class="row justify-content-center mb-4">

    </div>
              </div>              <div class="col-md-6">

    id="telefono"

        </div>
      <div class="invalid-feedback">          Entre 8 y 15 caracteres.      </div>
    </div>
              </div>            </div>          </div>        </div>      </div>
    </div>    <div class="row justify-content-center mb-4">
      <div class="col-lg-8">
        <div class="card fg-section-card bg-white text-dark">

          <div class="card-header bg-primary text-white fw-semibold fs-6">
            <i class="bi bi-layout-text-window-reverse me-2 opacity-75"></i>
            Detalles Ticket
          </div>

          <div class="card-body p-4">            <div class="row g-3">              <div class="col-md-6">
                    <div class="mb-3">
      <label for="categoria" class="form-label fw-semibold">
        Categoría del problema          <span class="text-danger ms-1" title="Requerido">*</span>      </label>

    class="form-select"

    </option>  </select>

      <div class="invalid-feedback">          Este campo es inválido.      </div>
    </div>
              </div>              <div class="col-md-6">
                    <div class="mb-3">
      <label for="prioridad" class="form-label fw-semibold">
        Prioridad          <span class="text-danger ms-1" title="Requerido">*</span>      </label>
          <select
    class="form-select"
    id="prioridad"
    name="prioridad" required  >
    <option value="" disabled selected>
      — Seleccionar —
    </option>    <option value="Baja">
      Baja

    </div>

    rows="4" placeholder="Describe el problema con el mayor detalle posible..." required minlength="20" maxlength="1000"  ></textarea>  <div class="form-text">Máximo 1000 caracteres.</div>
      <div class="invalid-feedback">          Entre 20 y 1000 caracteres.      </div>
    </div>

            Adjuntos

    </div>

      <div class="col-lg-8 d-flex gap-2 justify-content-end">        <button type="submit" class="btn btn-success" id="fg-btn-submit">

          <i class="bi bi-send me-1"></i>

      </div>
    </div>

</div>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmq4kOTBHPcXSHx7LzRuOcuztKA"
  crossorigin="anonymous"></script><script src="soporte_tecnico.js"></script>
<script>
(function () {
  'use strict';

  const form      = document.getElementById('fg-form');
  const spinner   = document.getElementById('fg-spinner');
  const submitBtn = document.getElementById('fg-btn-submit');

  // showToast expuesto globalmente para que el JS externo (validaciones) pueda usarlo
  window.showToast = function(msg, isError) {
    const toastEl  = document.getElementById('fg-toast');
    const toastMsg = document.getElementById('fg-toast-msg');
    toastMsg.textContent = msg;
    toastEl.classList.remove('text-bg-success', 'text-bg-danger');
    toastEl.classList.add(isError ? 'text-bg-danger' : 'text-bg-success');
    bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 4000 }).show();
  };

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    e.stopPropagation();

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    spinner.classList.remove('d-none');
    submitBtn.disabled = true;

    const formData = Object.fromEntries(new FormData(form).entries());

    try {      const res = await fetch('/api/soporte/tickets', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(formData),
      });

      if (res.ok) {
        window.showToast('Tu ticket fue enviado correctamente', false);        setTimeout(() => { window.location.href = '/soporte/confirmacion'; }, 1500);      } else {
        window.showToast('Error al enviar el ticket, intenta de nuevo', true);
      }
    } catch (err) {
      window.showToast('Error de red: ' + err.message, true);
    } finally {
      spinner.classList.add('d-none');
      submitBtn.disabled = false;
    }
  });  activarSoporteTecnico(form);})();
</script>

</body>
</html>
