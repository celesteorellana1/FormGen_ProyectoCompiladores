[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formgen"
version = "1.0.0"
description = "Compilador DSL para generación automática de formularios web"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "jinja2>=3.1.0"
]